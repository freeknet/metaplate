version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    # typescript-eslint 8 supports only TypeScript <6.1, and TypeScript 7 is
    # the native-compiler line. tsup 8's declaration build also needs
    # `ignoreDeprecations: "6.0"` in tsconfig.json until tsup 9 can be adopted,
    # which requires dropping Node 20 from the compatibility matrix.
    ignore:
      - dependency-name: typescript
        versions: [">=6.1"]
    commit-message:
      prefix: build
      include: scope
    groups:
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-patches:
        dependency-type: production
        update-types: [patch]

  # Workflows use immutable commit SHAs. Dependabot is the reviewable path
  # that moves those pins and updates their version comments.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
