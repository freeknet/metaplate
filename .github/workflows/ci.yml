name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full commit pins keep mutable action tags out of the trust chain.
      # Dependabot updates the SHA and trailing version comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:package
      - name: Write dependency and release evidence
        id: release-evidence
        run: npm run release:evidence
      # Upload whatever evidence exists even when a release check failed, so
      # release-check-results.json can explain the failure from the artifact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.release-evidence.outcome != 'skipped' }}
        with:
          name: dependency-and-release-evidence
          path: |
            dependency-inventory.json
            release-evidence-report.json
            release-check-results.json
            deployment-contract-evidence.json
            deployment-evidence.json
            socket-score-report.json
            socket-dispositions.json
          if-no-files-found: error
      - name: Exercise the post-publication verifier against the local artifact
        shell: bash
        run: |
          set -euo pipefail
          archive=$(npm pack --silent)
          version=$(node -p "require('./package.json').version")
          METAPLATE_PACKAGE_SPEC="$PWD/$archive" \
            node scripts/verify-published-package.mjs "$version"
      # Development dependencies execute during the build and are part of the
      # release trust chain, so high-severity findings in them block CI too.
      - run: npm audit --audit-level=high
      # Every installed package must carry a valid registry signature, and the
      # ones published with provenance must carry a verifiable attestation.
      - run: npm audit signatures

  compatibility:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exercise the documented minimum, every supported LTS line, and
          # Resvg's platform-specific native package on all runner families.
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build

  runtimes:
    name: Runtime smoke / ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required checks: "Runtime smoke / bun" and "Runtime smoke / deno" gate
    # merges to main, so a change that breaks either runtime cannot land.
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node installs the lockfile and builds dist/ exactly as the other jobs
      # do; only the smoke itself runs under the runtime being evidenced.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Certify what users install: pack the tarball and install it, with the
      # lockfile's peer versions, into a clean consumer outside the checkout.
      # The smoke imports metaplate by package name and fails unless every
      # entry resolves into that consumer's node_modules.
      - name: Prepare a consumer from the packed tarball
        run: node scripts/prepare-runtime-consumer.mjs "$RUNNER_TEMP/runtime-consumer"
      # Control: the same smoke under Node separates a broken script from a
      # runtime that cannot run the package.
      - name: Smoke the packed package under Node
        working-directory: ${{ runner.temp }}/runtime-consumer
        run: node verify-runtime.mjs --expect-runtime=node --expect-version="$(node -p 'require("./runtime-consumer.json").version')"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.runtime == 'bun'
        with:
          bun-version: latest
      - name: Smoke the packed package under Bun
        if: matrix.runtime == 'bun'
        working-directory: ${{ runner.temp }}/runtime-consumer
        run: bun verify-runtime.mjs --expect-runtime=bun --expect-version="$(node -p 'require("./runtime-consumer.json").version')"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: matrix.runtime == 'deno'
        with:
          deno-version: 2.x
      # Deno 2 resolves bare specifiers from the consumer's npm-installed
      # node_modules because its package.json is present; --no-lock keeps it
      # from writing a deno.lock, and --allow-all covers the file reads and
      # Resvg's N-API load.
      - name: Smoke the packed package under Deno
        if: matrix.runtime == 'deno'
        working-directory: ${{ runner.temp }}/runtime-consumer
        run: deno run --allow-all --no-lock verify-runtime.mjs --expect-runtime=deno --expect-version="$(node -p 'require("./runtime-consumer.json").version')"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
